<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donate Food - Food Donation Platform</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4fff8;
            color: #222;
        }

        /* HEADER */

        header {
            background: #087f5b;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
        }

        header h1 {
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* TITLE */

        .title {
            text-align: center;
            padding: 35px 20px 20px;
        }

        .title h2 {
            color: #087f5b;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        /* FORM */

        .form-container {
            max-width: 700px;
            margin: 25px auto;
            padding: 30px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 4px 18px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #087f5b;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: #055f45;
        }

        /* SUCCESS MESSAGE */

        #successMessage {
            display: none;

            margin-top: 20px;
            padding: 15px;

            background: #e7f8ef;
            color: #087f5b;

            border-radius: 8px;

            text-align: center;
            font-weight: bold;
        }

        /* FOOTER */

        footer {
            background: #087f5b;
            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 40px;
        }

        /* MOBILE */

        @media(max-width:600px) {

            header {
                justify-content: center;
                text-align: center;
            }

            nav {
                margin-top: 10px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .form-container {
                width: 92%;
                padding: 22px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>🍱 Donate Food</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="donor-dashboard.html">
            Dashboard
        </a>

        <a href="locations.html">
            Locations
        </a>

        <a href="history.html">
            History
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<!-- TITLE -->

<section class="title">

    <h2>
        Donate Your Extra Food ❤️
    </h2>

    <p>
        Fill in the details below to donate food
        to people in need.
    </p>

</section>


<!-- FORM -->

<div class="form-container">

    <form id="donationForm">


        <!-- DONOR NAME -->

        <div class="form-group">

            <label>
                Donor Name
            </label>

            <input
                type="text"
                id="donorName"
                placeholder="Enter your name"
                required>

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                required>

        </div>


        <!-- FOOD NAME -->

        <div class="form-group">

            <label>
                Food Name
            </label>

            <input
                type="text"
                id="foodName"
                placeholder="Example: Rice and Curry"
                required>

        </div>


        <!-- FOOD TYPE -->

        <div class="form-group">

            <label>
                Food Type
            </label>

            <select id="foodType" required>

                <option value="">
                    Select Food Type
                </option>

                <option>
                    Cooked Food
                </option>

                <option>
                    Fruits
                </option>

                <option>
                    Vegetables
                </option>

                <option>
                    Packaged Food
                </option>

                <option>
                    Bakery Items
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <!-- QUANTITY -->

        <div class="form-group">

            <label>
                Quantity
            </label>

            <input
                type="text"
                id="quantity"
                placeholder="Example: 10 kg / 20 packets"
                required>

        </div>


        <!-- EXPIRY -->

        <div class="form-group">

            <label>
                Food Expiry Date & Time
            </label>

            <input
                type="datetime-local"
                id="expiry"
                required>

        </div>


        <!-- ADDRESS -->

        <div class="form-group">

            <label>
                Pickup Address
            </label>

            <textarea
                id="address"
                placeholder="Enter the food pickup address"
                required></textarea>

        </div>


        <!-- LOCATION -->

        <div class="form-group">

            <label>
                Select Location
            </label>

            <select id="location" required>

                <option value="">
                    Select Location
                </option>

                <option>Adyar</option>
                <option>Guindy</option>
                <option>Ramapuram</option>
                <option>Anna Nagar</option>
                <option>Velachery</option>
                <option>Tambaram</option>
                <option>Karapakkam</option>
                <option>Padoor</option>
                <option>Porur</option>
                <option>Other</option>

            </select>

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

            <label>
                Additional Information
            </label>

            <textarea
                id="message"
                placeholder="Any additional information about the food..."></textarea>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="submit-btn">

            🍱 Submit Food Donation

        </button>


        <!-- SUCCESS -->

        <div id="successMessage">

            ✅ Donation submitted successfully!

            <br><br>

            Thank you for helping reduce food waste. ❤️

        </div>


    </form>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Food Donation Platform |
        Reduce Waste • Feed People ❤️
    </p>

</footer>


<script>

    document
        .getElementById("donationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            document
                .getElementById("successMessage")
                .style.display = "block";

            this.reset();

        });

</script>


</body>

</html>
