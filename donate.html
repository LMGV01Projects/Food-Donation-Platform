<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate Food - Food Donation Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8fff4, #ffffff);
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .container h2 {
            text-align: center;
            color: #087f5b;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #087f5b;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #055f45;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #087f5b;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            background: #087f5b;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

<header>

    <h1>🍱 Food Donation Platform</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="donate.html">Donate</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<div class="container">

    <h2>🍱 Donate Food</h2>

    <p class="description">
        Have extra food? Donate it and help someone in need.
    </p>


    <form id="donationForm">

        <label for="donorName">Donor Name</label>

        <input
            type="text"
            id="donorName"
            name="donorName"
            placeholder="Enter your name"
            required
        >


        <label for="foodName">Food Name</label>

        <input
            type="text"
            id="foodName"
            name="foodName"
            placeholder="Example: Rice, Bread, Vegetables"
            required
        >


        <label for="foodType">Food Type</label>

        <select id="foodType" name="foodType" required>

            <option value="">Select food type</option>
            <option value="Cooked Food">Cooked Food</option>
            <option value="Packaged Food">Packaged Food</option>
            <option value="Fruits">Fruits</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Bakery Items">Bakery Items</option>
            <option value="Other">Other</option>

        </select>


        <label for="quantity">Quantity</label>

        <input
            type="text"
            id="quantity"
            name="quantity"
            placeholder="Example: 10 packets / 5 kg"
            required
        >


        <label for="expiry">Food Expiry / Best Before</label>

        <input
            type="datetime-local"
            id="expiry"
            name="expiry"
            required
        >


        <label for="phone">Contact Number</label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >


        <label for="address">Pickup Address</label>

        <textarea
            id="address"
            name="address"
            placeholder="Enter the address where the NGO can collect the food"
            required
        ></textarea>
