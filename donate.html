<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate Food - Food Donation Platform</title>

    <style>
     <script>

const form = document.getElementById("donationForm");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    // Get existing donations
    let donations =
        JSON.parse(localStorage.getItem("donations")) || [];

    // Create new donation
    const donation = {

        id: Date.now(),

        donorName:
            document.getElementById("donorName").value,

        phone:
            document.getElementById("phone").value,

        foodName:
            document.getElementById("foodName").value,

        foodType:
            document.getElementById("foodType").value,

        quantity:
            document.getElementById("quantity").value,

        expiry:
            document.getElementById("expiry").value,

        address:
            document.getElementById("address").value,

        location:
            document.getElementById("location").value,

        message:
            document.getElementById("message").value,

        status: "Pending",

        date: new Date().toLocaleString()

    };


    // Add donation
    donations.push(donation);


    // Save to browser
    localStorage.setItem(
        "donations",
        JSON.stringify(donations)
    );


    // Success message
    document.getElementById("successMessage").style.display =
        "block";


    // Clear form
    form.reset();

});

</script>  

    </style>
</head>

<body>


<!-- HEADER -->

<header>

    <h1>🍱 Donate Food</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="donor-dashboard.html">
            Dashboard
        </a>

        <a href="locations.html">
            Locations
        </a>

        <a href="history.html">
            History
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<!-- TITLE -->

<section class="title">

    <h2>Donate Your Extra Food ❤️</h2>

    <p>
        Fill in the details below to donate food to people in need.
    </p>

</section>


<!-- DONATION FORM -->

<div class="form-container">

    <form id="donationForm">


        <!-- DONOR NAME -->

        <div class="form-group">

            <label>
                Donor Name
            </label>

            <input
                type="text"
                id="donorName"
                placeholder="Enter your name"
                required>

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                required>

        </div>


        <!-- FOOD NAME -->

        <div class="form-group">

            <label>
                Food Name
            </label>

            <input
                type="text"
                id="foodName"
                placeholder="Example: Rice and Curry"
                required>

        </div>


        <!-- FOOD TYPE -->

        <div class="form-group">

            <label>
                Food Type
            </label>

            <select id="foodType" required>

                <option value="">
                    Select Food Type
                </option>

                <option>
                    Cooked Food
                </option>

                <option>
                    Fruits
                </option>

                <option>
                    Vegetables
                </option>

                <option>
                    Packaged Food
                </option>

                <option>
                    Bakery Items
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <!-- QUANTITY -->

        <div class="form-group">

            <label>
                Quantity
            </label>

            <input
                type="text"
                id="quantity"
                placeholder="Example: 10 kg / 20 packets"
                required>

        </div>


        <!-- EXPIRY -->

        <div class="form-group">

            <label>
                Food Expiry Date & Time
            </label>

            <input
                type="datetime-local"
                id="expiry"
                required>

        </div>


        <!-- PICKUP ADDRESS -->

        <div class="form-group">

            <label>
                Pickup Address
            </label>

            <textarea
                id="address"
                placeholder="Enter the food pickup address"
                required></textarea>

        </div>


        <!-- LOCATION -->

        <div class="form-group">

            <label>
                Select Location
            </label>

            <select id="location" required>

                <option value="">
                    Select Location
                </option>

                <option>
                    Adyar
                </option>

                <option>
                    Guindy
                </option>

                <option>
                    Ramapuram
                </option>

                <option>
                    Anna Nagar
                </option>

                <option>
                    Velachery
                </option>

                <option>
                    Tambaram
                </option>

                <option>
                    Karapakkam
                </option>

                <option>
                    Padoor
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <!-- ADDITIONAL MESSAGE -->

        <div class="form-group">

            <label>
                Additional Information
            </label>

            <textarea
                id="message"
                placeholder="Any additional information about the food..."></textarea>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="submit-btn">

            🍱 Submit Food Donation

        </button>


        <!-- SUCCESS -->

        <div id="successMessage">

            ✅ Donation submitted successfully!

            <br><br>

            Thank you for helping reduce food waste. ❤️

        </div>

    </form>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Food Donation Platform |
        Reduce Waste • Feed People
    </p>

</footer>


<script>

    const form =
        document.getElementById("donationForm");

    const successMessage =
        document.getElementById("successMessage");


    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            successMessage.style.display =
                "block";


            form.reset();


            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

        }
    );

</script>

</body>
</html>
