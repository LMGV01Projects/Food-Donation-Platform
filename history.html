<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Donation History</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4fff8;
}

header {
    background: #087f5b;
    color: white;
    padding: 18px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.donation {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
}

.donation h3 {
    color: #087f5b;
}

.status {
    color: #d97706;
    font-weight: bold;
}

</style>

</head>

<body>

<header>

<h1>📋 Donation History</h1>

</header>


<div class="container">

<div id="history"></div>

</div>


<script>

const history =
document.getElementById("history");

const donations =
JSON.parse(localStorage.getItem("donations")) || [];


if (donations.length === 0) {

    history.innerHTML =
    "<h2>No donations found.</h2>";

}


donations.forEach(function(donation) {

    history.innerHTML += `

    <div class="donation">

        <h3>
            🍱 ${donation.foodName}
        </h3>

        <p>
            <b>Donor:</b>
            ${donation.donorName}
        </p>

        <p>
            <b>Food Type:</b>
            ${donation.foodType}
        </p>

        <p>
            <b>Quantity:</b>
            ${donation.quantity}
        </p>

        <p>
            <b>Location:</b>
            ${donation.location}
        </p>

        <p>
            <b>Pickup Address:</b>
            ${donation.address}
        </p>

        <p>
            <b>Expiry:</b>
            ${donation.expiry}
        </p>

        <p>
            <b>Status:</b>
            <span class="status">
                ${donation.status}
            </span>
        </p>

        <p>
            <b>Submitted:</b>
            ${donation.date}
        </p>

    </div>

    `;

});

</script>

</body>

</html>
