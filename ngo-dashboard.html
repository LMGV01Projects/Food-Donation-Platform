<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NGO Dashboard</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #f4fff8;
}

header {
    background: #087f5b;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
}

.card h2 {
    color: #087f5b;
}

button {
    background: #087f5b;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #055f45;
}

</style>

</head>

<body>

<header>

<h1>🤝 NGO Dashboard</h1>

<p>Food Donations Available</p>

</header>


<div class="container">

<div id="donations"></div>

</div>


<script>

function loadDonations() {

    const container =
    document.getElementById("donations");

    const donations =
    JSON.parse(localStorage.getItem("donations")) || [];


    container.innerHTML = "";


    if (donations.length === 0) {

        container.innerHTML =
        "<h2>No food donations available.</h2>";

        return;
    }


    donations.forEach(function(donation, index) {

        container.innerHTML += `

        <div class="card">

            <h2>
                🍱 ${donation.foodName}
            </h2>

            <p>
                <b>Donor:</b>
                ${donation.donorName}
            </p>

            <p>
                <b>Food Type:</b>
                ${donation.foodType}
            </p>

            <p>
                <b>Quantity:</b>
                ${donation.quantity}
            </p>

            <p>
                <b>Location:</b>
                ${donation.location}
            </p>

            <p>
                <b>Pickup Address:</b>
                ${donation.address}
            </p>

            <p>
                <b>Expiry:</b>
                ${donation.expiry}
            </p>

            <p>
                <b>Status:</b>
                ${donation.status}
            </p>

            <button
                onclick="acceptDonation(${index})">

                ✅ Accept Donation

            </button>

        </div>

        `;

    });

}


function acceptDonation(index) {

    let donations =
    JSON.parse(localStorage.getItem("donations")) || [];


    donations[index].status = "Accepted";


    localStorage.setItem(
        "donations",
        JSON.stringify(donations)
    );


    loadDonations();

}


loadDonations();

</script>

</body>

</html>
