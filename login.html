<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Food Donation Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8fff4, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #087f5b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #087f5b;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #055f45;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register-link,
        .home-link {
            text-align: center;
            margin-top: 18px;
        }

        a {
            color: #087f5b;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link a {
            color: #555;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>🔐 Login</h1>

    <p class="subtitle">
        Welcome back to Food Donation Platform
    </p>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <label for="role">Login As</label>

        <select id="role" name="role" required>

            <option value="">Select account type</option>
            <option value="donor">Donor</option>
            <option value="ngo">NGO</option>
            <option value="admin">Admin</option>

        </select>

        <button type="submit">
            Login
        </button>

        <div id="message"></div>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

    <div class="home-link">
        <a href="index.html">← Back to Home</a>
    </div>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    const message = document.getElementById("message");

    if (email === "" || password === "" || role === "") {

        message.style.color = "red";
        message.innerHTML = "❌ Please fill all fields.";

        return;
    }

    message.style.color = "#087f5b";
    message.innerHTML = "✅ Login successful!";

    /*
       Demo navigation.
       Later we will connect this login page
       with PHP + MySQL authentication.
    */

    setTimeout(function() {

        if (role === "ngo") {
            window.location.href = "ngo-dashboard.html";
        }

        else if (role === "admin") {
            window.location.href = "admin-dashboard.html";
        }

        else {
            window.location.href = "dashboard.html";
        }

    }, 1000);

});

</script>

</body>
</html>
