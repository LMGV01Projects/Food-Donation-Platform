<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Food Donation Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8fff4, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #087f5b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #087f5b;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #055f45;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #555;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>🍱 Create Account</h1>

    <p class="subtitle">
        Join our Food Donation Platform
    </p>

    <form id="registerForm">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <label for="role">Account Type</label>

        <select id="role" name="role" required>
            <option value="">Select account type</option>
            <option value="donor">Donor</option>
            <option value="ngo">NGO</option>
        </select>

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button type="submit">
            Register
        </button>

        <div id="message"></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <div class="home-link">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let role = document.getElementById("role").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    let message = document.getElementById("message");

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.innerHTML = "❌ Passwords do not match!";
        return;
    }

    if (password.length < 6) {
        message.style.color = "red";
        message.innerHTML = "❌ Password must contain at least 6 characters.";
        return;
    }

    message.style.color = "#087f5b";
    message.innerHTML = "✅ Registration form submitted successfully!";

    // Demo only
    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
