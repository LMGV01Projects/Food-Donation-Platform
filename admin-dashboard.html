<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #f4fff8;
}

header {
    background: #087f5b;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th {
    background: #087f5b;
    color: white;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
}

.status {
    font-weight: bold;
}

@media(max-width:700px) {

    table {
        font-size: 12px;
    }

    th, td {
        padding: 7px;
    }

}

</style>

</head>

<body>

<header>

<h1>⚙️ Admin Dashboard</h1>

<p>All Food Donations</p>

</header>


<div class="container">

<table>

<thead>

<tr>

<th>Donor</th>

<th>Food</th>

<th>Type</th>

<th>Quantity</th>

<th>Location</th>

<th>Expiry</th>

<th>Status</th>

</tr>

</thead>

<tbody id="adminData">

</tbody>

</table>

</div>


<script>

const table =
document.getElementById("adminData");

const donations =
JSON.parse(localStorage.getItem("donations")) || [];


if (donations.length === 0) {

    table.innerHTML = `

    <tr>

        <td colspan="7">
            No donations available
        </td>

    </tr>

    `;

}


donations.forEach(function(donation) {

    table.innerHTML += `

    <tr>

        <td>
            ${donation.donorName}
        </td>

        <td>
            ${donation.foodName}
        </td>

        <td>
            ${donation.foodType}
        </td>

        <td>
            ${donation.quantity}
        </td>

        <td>
            ${donation.location}
        </td>

        <td>
            ${donation.expiry}
        </td>

        <td class="status">
            ${donation.status}
        </td>

    </tr>

    `;

});

</script>

</body>

</html>
